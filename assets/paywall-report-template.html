<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{REPORT_TITLE}}</title>
  <style>
    :root {
      --page:#f1f2f1; --card:#fff; --text:#171a18; --muted:#858c87;
      --mint:#f3f7f3; --mint-2:#eef5ef; --green:#08a957; --green-dark:#087a42;
      --border:#e2e7e3; --amber:#9a6500; --amber-bg:#fff7e8;
      --red:#a43a43; --red-bg:#fff0f1; --shadow:0 18px 55px rgba(24,40,29,.07);
    }
    *{box-sizing:border-box} html{scroll-behavior:smooth}
    body{margin:0;background:var(--page);color:var(--text);font:15px/1.72 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
    a{color:var(--green-dark);text-underline-offset:3px} img{display:block;max-width:100%;height:auto}
    .shell{width:min(1240px,calc(100% - 40px));margin:0 auto;padding:42px 0 72px}
    .report-header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin:0 0 22px;padding:0 4px}
    .report-header h1{max-width:880px;margin:0;font-size:clamp(28px,4vw,52px);line-height:1.08;letter-spacing:-.045em}
    .report-meta{flex:0 0 auto;color:var(--muted);font-size:13px;text-align:right}
    main{display:grid;gap:24px}
    section.card,.card{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--border);border-radius:26px;padding:clamp(24px,4vw,48px);box-shadow:var(--shadow)}
    section.card::before,.card::before{content:"";position:absolute;inset:0 0 auto;height:6px;background:linear-gradient(90deg,var(--green),#73c865)}
    .eyebrow,.section-label{display:inline-flex;align-items:center;gap:7px;margin:0 0 12px;padding:5px 10px;border-radius:999px;background:#eaf7ee;color:var(--green-dark);font-weight:700;font-size:12px;letter-spacing:.02em}
    h2,h3,h4{margin:0 0 14px;line-height:1.2;letter-spacing:-.025em} h2{font-size:clamp(24px,3vw,36px)} h3{font-size:21px} h4{font-size:16px}
    p{margin:0 0 14px}.muted,.note{color:var(--muted)} ul,ol{margin:10px 0 0;padding-left:22px} li+li{margin-top:7px}
    .grid2,.grid3,.strategy-grid,.copy-grid,.judgment-grid,.metrics{display:grid;gap:16px}
    .grid2,.strategy-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3,.copy-grid,.judgment-grid,.metrics{grid-template-columns:repeat(3,minmax(0,1fr))}
    .panel,.strategy-item,.copy-card,.metric{background:var(--mint);border:1px solid var(--border);border-radius:18px;padding:20px}
    .hero,.reference{display:grid;grid-template-columns:minmax(260px,.78fr) minmax(0,1.45fr);gap:28px;align-items:start}
    .screenshot{overflow:hidden;border:1px solid var(--border);border-radius:20px;background:#f8f9f8}.screenshot img{width:100%;object-fit:contain}
    .why-selected{margin-bottom:16px;padding:16px 18px;border-left:4px solid var(--green);border-radius:4px 14px 14px 4px;background:var(--mint)}
    .strategy-item small,.metric small{display:block;color:var(--muted);font-size:12px}.strategy-item strong{display:block;margin-top:5px;font-size:16px}
    .pattern-row{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.pattern{padding:6px 10px;border:1px solid #dce5de;border-radius:999px;background:#fff;font-size:12px;font-weight:700}
    .judgment{border:1px solid;border-radius:18px;padding:18px}.judgment.borrow{background:#eef8f1;border-color:#cbe8d3;color:#155f33}.judgment.adapt{background:var(--amber-bg);border-color:#f1dba6;color:#684400}.judgment.avoid{background:var(--red-bg);border-color:#efc9cc;color:#7f2830}
    .commercial{margin-top:16px;padding:15px 18px;border-radius:16px;background:#f5f6f5;color:var(--muted)}
    .commercial strong,.metric strong,.data-number{display:inline-block;color:var(--text);font-size:clamp(18px,2vw,24px);line-height:1.1;font-weight:800}
    .provenance{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);color:var(--muted);font-size:12px}
    .callout{padding:18px 20px;border-left:4px solid var(--green);border-radius:4px 16px 16px 4px;background:var(--mint)}
    .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:18px} table{width:100%;min-width:760px;border-collapse:collapse;background:#fff} th,td{padding:14px 16px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);vertical-align:top;text-align:left} th:last-child,td:last-child{border-right:0} tr:last-child td{border-bottom:0} th{background:var(--mint-2);color:#356043;font-size:12px;letter-spacing:.02em} tbody tr:nth-child(even){background:#fafcfb}
    .copy-card .copy-cn{margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border);color:#4b514d}.copy-card .locale{font-weight:800;font-size:18px}
    footer{padding:24px 4px 0;color:var(--muted);font-size:12px;text-align:center}
    @media(max-width:860px){.shell{width:min(100% - 24px,760px);padding-top:24px}.report-header{align-items:flex-start;flex-direction:column}.report-meta{text-align:left}.hero,.reference,.grid2,.grid3,.strategy-grid,.copy-grid,.judgment-grid,.metrics{grid-template-columns:1fr}section.card,.card{border-radius:20px;padding:24px}.screenshot{max-width:520px;margin:auto}}
    @media print{body{background:#fff}.shell{width:100%;padding:0}.card,section.card{box-shadow:none;break-inside:avoid}.report-header{padding-top:0}}
  </style>
</head>
<body data-report-id="{{REPORT_ID}}">
  <div class="shell">
    <header class="report-header">
      <h1>{{REPORT_TITLE}}</h1>
      <div class="report-meta">更新于 {{GENERATED_AT}}</div>
    </header>
    <main>{{REPORT_BODY}}</main>
    <footer>订阅页研究报告 · 数据与视觉观察均需结合产品真实交易配置验证</footer>
  </div>
</body>
</html>
